"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$username\
[@](#f5f5f5 bold)\
$hostname\
[:](#646464)\
$directory\
$git_branch\
$git_status\
$character"""

right_format = ""

[character]
success_symbol = "[\\$](#e22b31 bold)"
error_symbol = "[\\$](#e22b31 bold)"

[username]
show_always = true
format = "[$user](#f5f5f5 bold)"

[hostname]
ssh_only = false
format = "[$hostname](#f5f5f5 bold)"

[directory]
style = "bold #ff6b6b"
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
style = "bold #ff787d"
symbol = "git"
format = "[$symbol\\(]($style)[$branch](bold #a6e3a1)[\\)]($style) "

[git_status]
style = "bold #e22b31"
conflicted = "x"
ahead = "^"
behind = "v"
diverged = "<>"
up_to_date = "="
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = ">"
deleted = "-"
format = "([$all_status$ahead_behind]($style))"
