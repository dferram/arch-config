# Native PipeWire DSP boost + limiter for Huawei MateBook internal speakers.
# Removes sub-bass (<105 Hz) that tiny laptop speakers cannot reproduce,
# adds gentle warmth/vocal clarity, and applies +9 dB makeup gain with an
# LV2 stereo limiter (-0.8 dB ceiling) to prevent clipping.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MateBook Speakers (Boosted)"
            media.name       = "MateBook Speakers (Boosted)"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = hp_l
                        label   = bq_highpass
                        control = { "Freq" = 105.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = hp_r
                        label   = bq_highpass
                        control = { "Freq" = 105.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = warm_l
                        label   = bq_peaking
                        control = { "Freq" = 240.0 "Q" = 1.0 "Gain" = 2.0 }
                    }
                    {
                        type    = builtin
                        name    = warm_r
                        label   = bq_peaking
                        control = { "Freq" = 240.0 "Q" = 1.0 "Gain" = 2.0 }
                    }
                    {
                        type    = builtin
                        name    = clarity_l
                        label   = bq_peaking
                        control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = 2.5 }
                    }
                    {
                        type    = builtin
                        name    = clarity_r
                        label   = bq_peaking
                        control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = 2.5 }
                    }
                    {
                        type    = lv2
                        name    = limiter
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            "enabled" = 1
                            "mode"    = 0
                            "g_in"    = 1.0
                            "g_out"   = 0.912011
                            "alr"     = 1
                            "alr_at"  = 5.0
                            "alr_rt"  = 50.0
                            "th"      = 0.354813
                            "knee"    = 1.0
                            "boost"   = 1
                            "lk"      = 5.0
                            "at"      = 5.0
                            "rt"      = 5.0
                            "slink"   = 100.0
                        }
                    }
                ]
                links = [
                    { output = "hp_l:Out"      input = "warm_l:In" }
                    { output = "warm_l:Out"    input = "clarity_l:In" }
                    { output = "clarity_l:Out" input = "limiter:in_l" }
                    { output = "hp_r:Out"      input = "warm_r:In" }
                    { output = "warm_r:Out"    input = "clarity_r:In" }
                    { output = "clarity_r:Out" input = "limiter:in_r" }
                ]
                inputs  = [ "hp_l:In" "hp_r:In" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "matebook_speaker_boost"
                node.description = "MateBook Speakers (Boosted)"
                media.class      = Audio/Sink
                priority.session = 1600
                device.icon-name = "audio-speakers"
            }
            playback.props = {
                node.name          = "matebook_speaker_boost_output"
                node.passive       = true
                node.dont-fallback = true
                target.object      = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
]
