# ==============================================================================
# HYPRLOCK — TRUE FULLSCREEN MONUMENTAL FLIP CLOCK (FLIQLO AESTHETIC)
# Pure OLED Black Background (0 nits) with Slate-Grey Mechanical Cards
# ==============================================================================

# Pure OLED Black Background (Pixels powered completely OFF)
background {
    monitor =
    color = rgb(0, 0, 0)
}

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    fail_timeout = 1000
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = inputFieldColors, 1, 4, ease
}

# ------------------------------------------------------------------------------
# Monumental Flip Clock Tiles (Background Cards - Slate Grey)
# ------------------------------------------------------------------------------

# Hour Card (Left - 620x820px)
shape {
    monitor =
    size = 620, 820
    color = rgb(24, 25, 28)
    rounding = 46
    border_size = 0
    position = -344, 12
    halign = center
    valign = center
}

# Minute Card (Right - 620x820px)
shape {
    monitor =
    size = 620, 820
    color = rgb(24, 25, 28)
    rounding = 46
    border_size = 0
    position = 344, 12
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# Monumental Flip Clock Typography (Hours & Minutes)
# ------------------------------------------------------------------------------

# AM / PM Indicator (Upper Left of Hour Card)
label {
    monitor =
    text = cmd[update:10000] echo "$(date +'%p')"
    color = rgb(145, 150, 158)
    font_size = 68
    font_family = Bebas Neue
    position = -589, 360
    halign = center
    valign = center
}

# Hour Digits (Monumental Bebas Neue spanning the card)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I')"
    color = rgb(225, 228, 232)
    font_size = 510
    font_family = Bebas Neue
    position = -344, 12
    halign = center
    valign = center
}

# Minute Digits (Monumental Bebas Neue spanning the card)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    color = rgb(225, 228, 232)
    font_size = 510
    font_family = Bebas Neue
    position = 344, 12
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# Flip Horizontal Seam Split (Pure OLED Black Flap Crack)
# ------------------------------------------------------------------------------

# Hour Card Seam
shape {
    monitor =
    size = 620, 8
    color = rgb(0, 0, 0)
    rounding = 0
    border_size = 0
    position = -344, 12
    halign = center
    valign = center
}

# Minute Card Seam
shape {
    monitor =
    size = 620, 8
    color = rgb(0, 0, 0)
    rounding = 0
    border_size = 0
    position = 344, 12
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# Minimalist Password Input Anchored at the Absolute Bottom
# ------------------------------------------------------------------------------

# Minimalist Password Input Pill at the absolute bottom edge
input-field {
    monitor =
    size = 220, 26
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.10)
    inner_color = rgba(10, 10, 10, 0.85)
    font_color = rgb(230, 235, 240)
    fade_on_empty = false
    placeholder_text = <span foreground="##606570">Password...</span>
    check_color = rgb(66, 160, 191)
    fail_color = rgb(239, 68, 68)
    fail_text = <i>Incorrect</i>
    hide_input = false
    rounding = 13
    position = 0, 8
    halign = center
    valign = bottom
}

# Silent Biometric Auth (Fingerprint hardware unlock on power button)
auth {
    fingerprint:enabled = true
    fingerprint:ready_message =
    fingerprint:present_message =
}
