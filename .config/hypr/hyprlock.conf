# Pure black background
background {
    monitor =
    color = rgb(0, 0, 0)
}

# Fullscreen bold white clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgb(255, 255, 255)
    font_size = 380
    font_family = sans-serif
    position = 0, 70
    halign = center
    valign = center
}

general {
    fail_timeout = 1000
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = inputFieldColors, 1, 4, ease
}

# Dark mode minimalist input with pure border color animation
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(35, 42, 54)
    inner_color = rgb(12, 14, 20)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text =
    check_color = rgb(34, 197, 94)
    check_text =
    fail_color = rgb(239, 68, 68)
    fail_text =
    hide_input = false
    rounding = 12
    position = 0, 90
    halign = center
    valign = bottom
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message =
    fingerprint:present_message =
}
