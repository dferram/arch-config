<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- Sphere Lighting & Depth (same technique as weather-clear-night) -->
    <linearGradient id="sphereGrad" x1="12" y1="4" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b485d"/>
      <stop offset="45%" stop-color="#1e2736"/>
      <stop offset="100%" stop-color="#0f1622"/>
    </linearGradient>

    <radialGradient id="specularGlow" cx="20" cy="12" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>

    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Calendar Red Header 3D Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="12" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d5a"/>
      <stop offset="100%" stop-color="#c9182b"/>
    </linearGradient>

    <!-- Calendar Paper Gradient -->
    <linearGradient id="paperGrad" x1="0" y1="20" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Metallic Ring Gradient -->
    <linearGradient id="ringGrad" x1="0" y1="9" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Filter for soft realistic drop shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Base 3D Sphere (similar to moon sphere) with outer rim and specular lighting -->
  <circle cx="24" cy="24" r="21" fill="url(#rimLight)" filter="url(#shadowFilter)"/>
  <circle cx="24" cy="24" r="20" fill="url(#sphereGrad)"/>
  <circle cx="24" cy="24" r="20" fill="url(#specularGlow)"/>

  <!-- Spherical bottom shadow -->
  <path d="M 6.5 29 C 8.5 38 15.5 43.5 24 43.5 C 32.5 43.5 39.5 38 41.5 29 C 38.5 39 31.5 42 24 42 C 16.5 42 9.5 39 6.5 29 Z" fill="#000000" opacity="0.35"/>

  <!-- 2. 3D Floating Calendar Card -->
  <g filter="url(#cardShadow)">
    <!-- Calendar Body (Paper) -->
    <rect x="11.5" y="14" width="25" height="23" rx="3.5" fill="url(#paperGrad)"/>

    <!-- Calendar Red Header -->
    <path d="M 11.5 17.5 C 11.5 15.5 13 14 15 14 L 33 14 C 35 14 36.5 15.5 36.5 17.5 L 36.5 21 L 11.5 21 Z" fill="url(#headerGrad)"/>

    <!-- Header Subtle Top Highlight -->
    <path d="M 15 14.5 L 33 14.5" stroke="#ff949d" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Gold / Silver Binder Rings -->
    <rect x="16.5" y="11.5" width="2.6" height="5" rx="1.3" fill="url(#ringGrad)"/>
    <rect x="28.9" y="11.5" width="2.6" height="5" rx="1.3" fill="url(#ringGrad)"/>

    <!-- Calendar Grid / Days representation -->
    <!-- Row 1 dots/dashes -->
    <rect x="15" y="24" width="3.5" height="2.5" rx="0.8" fill="#94a3b8"/>
    <rect x="20.5" y="24" width="3.5" height="2.5" rx="0.8" fill="#94a3b8"/>
    <rect x="26" y="24" width="3.5" height="2.5" rx="0.8" fill="#94a3b8"/>
    <rect x="31.5" y="24" width="2" height="2.5" rx="0.8" fill="#cbd5e1"/>

    <!-- Row 2 (highlighted current event day in red) -->
    <rect x="15" y="28.5" width="3.5" height="2.5" rx="0.8" fill="#94a3b8"/>
    <rect x="20.5" y="28" width="7" height="6.5" rx="1.5" fill="#e22b31"/>
    <rect x="29.5" y="28.5" width="4" height="2.5" rx="0.8" fill="#94a3b8"/>

    <!-- Event star/dot inside highlighted box -->
    <circle cx="24" cy="31.2" r="1.5" fill="#ffffff"/>

    <!-- Row 3 dots -->
    <rect x="15" y="33" width="3.5" height="2.2" rx="0.8" fill="#cbd5e1"/>
    <rect x="29.5" y="33" width="4" height="2.2" rx="0.8" fill="#cbd5e1"/>
  </g>
</svg>
